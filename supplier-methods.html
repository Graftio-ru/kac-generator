<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Способы получения данных поставщиков</title><style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 16px}article{border:1px solid #ccc;border-radius:8px;padding:16px;margin:16px 0}button,input,select{font:inherit;padding:8px}input{width:45%}.error{color:#a20}</style><a href="/">← К расчёту</a><h1>Способы получения данных</h1><p>Один способ для каждого сайта. При сбое автоматического переключения нет. «Сохранить» вручную меняет способ или повторно разрешает его проверку; это не подтверждение успешного доступа.</p><p id="message" role="status"></p><main id="rows"></main><script>
'use strict';
const main=document.getElementById('rows'),message=document.getElementById('message');
async function load(){const response=await fetch('/supplier-methods/config',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw Error('Не удалось загрузить настройки');render(await response.json());}
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function render(data){main.replaceChildren();for(const row of data.rows){const card=element('article');card.append(element('h2',row.name+' — '+row.host));const state=row.state==='requires_configuration'?'Требуется настройка':'Способ выбран';card.append(element('p',state));if(row.last_failure){const f=row.last_failure;card.append(element('p','Последний сбой: '+({http_access:'доступ отклонён',rate_limit:'слишком частые запросы',protection:'защита сайта',network_timeout:'истекло время ожидания',network_error:'ошибка соединения',representation:'не удалось прочитать страницу',navigation:'не открылась страница'}[f.cause]||'не удалось получить данные')+(f.http_status?' · HTTP '+f.http_status:'')+' · '+new Date(f.observed_at*1000).toLocaleString()));}const select=element('select');select.setAttribute('aria-label','Способ для '+row.host);for(const [v,label]of [['browser','Браузер'],['http','HTTP']]){const option=element('option',label);option.value=v;select.append(option);}select.value=row.method;const reason=element('input');reason.placeholder='Комментарий (необязательно)';reason.maxLength=512;reason.setAttribute('aria-label','Причина для '+row.host);const save=element('button','Сохранить');save.onclick=async()=>{save.disabled=true;message.textContent='';try{const response=await fetch('/supplier-methods/config',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:row.host,method:select.value,expected_revision:row.revision,reason:reason.value.trim()||'Ручной выбор способа'})});if(!response.ok)throw Error(response.status===409?'Настройка уже изменилась. Обновите страницу.':'Сохранение не выполнено');render(await response.json());message.textContent='Сохранено. Следующая попытка использует выбранный способ.';}catch(error){message.textContent=error.message;message.className='error';}finally{save.disabled=false;}};card.append(select,reason,save);main.append(card);}}
load().catch(()=>{message.textContent='Настройки недоступны. Данные не изменены.';});
</script></html>
