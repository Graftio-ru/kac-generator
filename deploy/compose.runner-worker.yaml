# Standalone OTHER RUNNER-host recipe. Do NOT combine with control compose.
# No control-host secret files, gateway, listener or shared SQLite.
services:
  runner-worker:
    image: ${KAC_APP_IMAGE:?set identical reviewed immutable image}
    command: [python, -m, engine.runner_service, runner]
    restart: unless-stopped
    init: true
    user: "10001:10001"
    shm_size: "1gb"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 32m
    env_file:
      # Native provider keys, RUNNER_CONTROL_ORIGIN, RUNNER_USERNAME/PASSWORD.
      # No Cloud IAM power-management credential. No actual file supplied here.
      - ${KAC_RUNNER_ENV_FILE:?set RUNNER-only operator-provisioned file}
    environment:
      DEPLOYMENT_MODE: server
      EXECUTION_MODE: remote
      RUNNER_ROLE: executor
      # Native app validates both human and distinct machine auth policies at
      # import, even though executor exposes no listener. Explicit fail-closed.
      SERVER_PUBLIC_ORIGIN: ${KAC_RUNNER_SERVER_PUBLIC_ORIGIN:?set reviewed HTTPS origin}
      SERVER_USERNAME: ${KAC_RUNNER_SERVER_USERNAME:?set native server policy username}
      SERVER_PASSWORD_HASH: ${KAC_RUNNER_SERVER_PASSWORD_HASH:?set PBKDF2 server hash}
      RUNNER_PASSWORD_HASH: ${KAC_RUNNER_PASSWORD_HASH:?set distinct runner PBKDF2 hash}
      RUNNER_SERVICE_ENABLED: ${KAC_RUNNER_WORKER_ENABLED:-false}
      BROWSER_HEADED: "false"
      BROWSER_CHANNEL: ""
    volumes:
      - type: bind
        source: ${KAC_RUNNER_DATA_DIR:?set durable native data on RUNNER host ONLY}
        target: /app/engine/data
